server:
  port: 8083

spring:
  application:
    name: institution-service
  datasource:
    url: jdbc:postgresql://localhost:5432/institution_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  jwt:
    secret: ${JWT_SECRET:changeit_changeit_changeit_changeit}
    expiration-ms: 900000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.alumni.platform.institution: DEBUG