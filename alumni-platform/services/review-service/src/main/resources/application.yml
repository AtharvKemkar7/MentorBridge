server:
  port: 8086

spring:
  application:
    name: review-service
  datasource:
    url: jdbc:postgresql://localhost:5438/review_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: "changeit_changeit_changeit_changeit"

security:
  jwt:
    secret: ${JWT_SECRET:changeit_changeit_changeit_changeit}
    expiration-ms: 900000 # 15 minutes

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.alumni.platform.review: DEBUG