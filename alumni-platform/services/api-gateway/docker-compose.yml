version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      IDENTITY_SERVICE_URL: http://host.docker.internal:8081
      PROFILE_SERVICE_URL: http://host.docker.internal:8082
      INSTITUTION_SERVICE_URL: http://host.docker.internal:8083
      MENTORSHIP_SERVICE_URL: http://host.docker.internal:8084
      BOOKING_SERVICE_URL: http://host.docker.internal:8085
      REVIEW_SERVICE_URL: http://host.docker.internal:8086
      NOTIFICATION_SERVICE_URL: http://host.docker.internal:8087
      FRONTEND_ORIGIN: http://localhost:4200
    depends_on: []